<style>
/* Layout idea: a phone-width column (max 480px) with sticky header, scrolling body and a fixed bottom tab bar. Olive and sand palette: deep olive, brand olive (#6B7356) and sand (#D7C1A2). Variable names --navy and --gold are kept: --navy = deep olive, --gold = brand accent. */
:root{
  --bg:#F5F3EC; --surface:#FFFFFF; --ink:#21241A; --muted:#656857; --line:#E3DFD2;
  --navy:#434B34; --gold:#6B7356; --gold-ink:#FFFFFF; --gold-soft:#EEE6D3; --sand:#D7C1A2; --c1:#434B34; --c2:#A8884F;
  --good:#1B7448; --warn:#A35A06; --bad:#B3261E; --info:#2B5FA8;
  --good-bg:#E3F3EA; --warn-bg:#FBEBD3; --bad-bg:#FBE4E2; --info-bg:#E2ECF8; --muted-bg:#ECE9DF;
  --da:#0F6E56; --da-bg:#E1F5EE; --display:'Cormorant Garamond',Georgia,serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12150E; --surface:#1C2016; --ink:#ECEADF; --muted:#A5A890; --line:#2F3526;
    --navy:#0D100A; --gold:#D7C1A2; --gold-ink:#1A1D12; --gold-soft:#2A281B; --sand:#D7C1A2; --c1:#9AA67F; --c2:#D7C1A2;
    --good:#5CCB92; --warn:#EDA74B; --bad:#F28B82; --info:#8FB5EA;
    --good-bg:#16301F; --warn-bg:#33260F; --bad-bg:#371A19; --info-bg:#172A44; --muted-bg:#262C1F; --da:#5DCAA5; --da-bg:#0F2F28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#12150E; --surface:#1C2016; --ink:#ECEADF; --muted:#A5A890; --line:#2F3526;
    --navy:#0D100A; --gold:#D7C1A2; --gold-ink:#1A1D12; --gold-soft:#2A281B; --sand:#D7C1A2; --c1:#9AA67F; --c2:#D7C1A2;
    --good:#5CCB92; --warn:#EDA74B; --bad:#F28B82; --info:#8FB5EA;
    --good-bg:#16301F; --warn-bg:#33260F; --bad-bg:#371A19; --info-bg:#172A44; --muted-bg:#262C1F; --da:#5DCAA5; --da-bg:#0F2F28;
    color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
body,button,input,select,textarea{font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:56px;flex:none}
header.top h1{font-family:var(--display);font-size:22px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .ib{background:transparent;border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative}
header.top .ib:focus-visible,.btn:focus-visible,.nav button:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.badge{position:absolute;top:2px;right:0;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
main>*{flex-shrink:0}
.hgrid{display:flex;flex-direction:column;gap:16px}
.hcol{display:contents}
.tbl{table-layout:auto}
.card>div{min-height:min-content}
nav.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px;align-items:end}
nav.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;font-weight:500}
nav.nav button.on{color:var(--gold);font-weight:700}
nav.nav button.fab span.c{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 12px rgba(0,0,0,.25);border:3px solid var(--bg)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:block;width:100%;text-align:left;flex-shrink:0}
button.card{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.row.sp{margin-top:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.t{font-weight:600}.m{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--muted-bg);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.pill.da{background:var(--da-bg);color:var(--da)}
.src{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--muted-bg);padding:4px;border-radius:12px}
.src button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted)}
.src button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1;min-width:120px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea,.inp{font-size:16px!important;-webkit-text-size-adjust:100%;touch-action:manipulation}
.inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:46px}
.inp:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
textarea.inp{min-height:76px;resize:vertical}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigamt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:6px 14px}
.bigamt span{font-family:var(--display);font-size:32px;color:var(--gold);font-weight:700}
.bigamt input{border:0;background:transparent;font-family:var(--display);font-size:34px;font-weight:700;width:100%;outline:none;min-width:0;font-variant-numeric:tabular-nums}
.chips{flex-shrink:0;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 6px;font-weight:600;color:var(--muted)}
.seg button.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.hot{border-color:var(--gold);background:var(--gold-soft)}
h2{font-family:var(--display);font-size:22px;margin:0 0 8px;font-weight:700}
.sec{display:flex;flex-direction:column;gap:8px}
.dh{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-top:4px}
.list{display:flex;flex-direction:column;gap:10px}
.bar{height:10px;background:var(--muted-bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.hb{display:flex;flex-direction:column;gap:10px}
.hb .r{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:13px}
.hb .r .bar{grid-column:1/-1}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.trail{display:flex;flex-direction:column;gap:12px;padding-left:4px}
.trail .s{display:grid;grid-template-columns:14px 1fr;gap:10px}
.trail .d{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:5px}
.trail .d.bad{background:var(--bad)}.trail .d.info{background:var(--info)}.trail .d.good{background:var(--good)}
.rc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rc .th{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--muted-bg) center/cover no-repeat;position:relative}
.rc .th button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.stkm .tbl th,.stkm .tbl td{padding:6px 4px;white-space:normal;font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .inp{padding:10px 8px;min-width:0}
.g2 .f{font-size:12px;min-width:0}
.prt th:first-child,.prt td:first-child{white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600;font-size:12px}
.tbl tfoot td{font-weight:700;border-bottom:0}
.scroll-x{overflow-x:auto}
.note{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.login{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:28px 22px;background:var(--navy);color:#fff}

.login .logo{width:84px;height:84px;border-radius:22px;background-color:#6B7356;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto}
.login .logo .mark{width:62px;height:62px}
header.top .mark{width:30px;height:30px;margin-right:2px}
.login h1{font-family:var(--display);font-size:34px;text-align:center;margin:0;font-weight:700}
.login p{margin:0;text-align:center;color:#B9BFD6}
.login .inp{background:#fff;color:#15192B;border-color:#fff}
.login .phone{display:flex;gap:8px}
.login .phone .cc{background:rgba(255,255,255,.12);border-radius:10px;padding:0 14px;display:grid;place-items:center;font-weight:600}
.login .demo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.login .demo button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;padding:6px 12px;font-size:12.5px}
.login .err{color:#FFB4AB;text-align:center;font-size:14px;min-height:20px}
#modal{position:fixed;inset:0;background:rgba(10,12,24,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--surface);border-radius:16px;padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:24px;font-size:14px;font-weight:600;display:none;z-index:30;max-width:90%;text-align:center}
#toast.on{display:block}
.hide{display:none}
#ctip{position:fixed;z-index:9999;pointer-events:none;display:none;max-width:260px;padding:8px 12px;border-radius:10px;background:#434B34;color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px;line-height:1.35;font-variant-numeric:tabular-nums}
#ctip b{display:block;font-size:13px;letter-spacing:.02em;margin-bottom:2px;color:#EBDCC0}
[data-tip]{cursor:pointer}
svg rect[data-tip]:hover,svg circle[data-tip]:hover{filter:brightness(1.15)}
svg .hitc:hover{fill:currentColor;fill-opacity:.08}
svg circle.hitd:hover{fill:currentColor;fill-opacity:.18}
.hb .r[data-tip]:hover{background:var(--muted-bg);border-radius:8px}
@media (prefers-reduced-motion: no-preference){main{scroll-behavior:smooth}}

.rtake{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px 16px}
.rtake h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rtake li{margin:7px 0;line-height:1.5}
.rk{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rch{display:grid;grid-template-columns:1fr;gap:14px}
.rch>.card{margin:0}
/* ---------- desktop and tablet layouts (phone layout above is unchanged) ---------- */
@media(min-width:700px){
  #app{max-width:760px}
  main{padding:20px 24px 28px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .rk{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  #toast{bottom:28px}
}
@media(min-width:1000px){
  .rch.two{grid-template-columns:1fr 1fr}
  #app{max-width:1320px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  #app:has(nav.nav){display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "nav main"}
  #app:has(nav.nav) header.top{grid-area:top;padding:12px 28px}

      cash:r[0].days.filter(function(d){return d.opening!==null&&(d.received||d.paid||d.actual!==null);}).map(function(d){return {date:d.date,open:d.opening,rec:d.received,paid:d.paid,close:d.balance,actual:d.actual===null?d.balance:d.actual,diff:d.diff||0,notes:d.notes};}),

function demoRows(tab,date){
  var seed=parseInt(date.replace(/-/g,''),10),arr=DA_DEMO[tab],n=Math.min(arr.length,2+seed%3),off=seed%arr.length,out=[];

function me(){return db.users.filter(function(u){return u.id===db.session;})[0]||null;}

function inScope(e,u){return u.role==='employee'?e.emp===u.id:u.role==='manager'?e.showroom===u.showroom:true;}
function scoped(u){return db.exps.filter(function(e){return inScope(e,u);});}
function canAct(e,u){
  var r=APPROVER[e.status];if(!r)return false;
  if(e.emp===u.id)return false; /* no self approval */
  if(u.role==='super_admin')return true;
  if(u.role!==r)return false;
  if(u.role==='manager'&&u.showroom!==e.showroom)return false;
  return true;
}
function canPay(e,u){return (u.role==='accounts'||u.role==='super_admin')&&e.status==='approved'&&e.pay!=='paid';}
function outstanding(e){return Math.round((e.amount-e.paid)*100)/100;}
function pettyBalance(){
  var out=db.pays.filter(function(p){return p.method==='cash';}).reduce(function(s,p){return s+p.amount;},0);
  return db.settings.pettyOpening-out;
}
function addTrail(e,uId,action,comment,kind){e.trail.push({who:uId,action:action,comment:comment||'',ts:new Date().toISOString(),kind:kind||''});}
function act(e,u,kind,comment){
  if(!canAct(e,u))return 'You cannot act on this expense.';
  if((kind==='reject'||kind==='return')&&!String(comment||'').trim())return 'Add a comment before you '+kind+'.';
  if(kind==='approve'){
    if(e.status==='submitted'){e.status='manager_approved';addTrail(e,u.id,'Approved by Manager',comment,'good');}
    else if(e.status==='manager_approved'){
      if(e.amount>db.settings.mdThreshold){e.status='awaiting_md';addTrail(e,u.id,'Verified by Accounts',comment,'good');}
      else{e.status='approved';addTrail(e,u.id,'Verified by Accounts',comment,'good');}
    }else if(e.status==='awaiting_md'){e.status='approved';addTrail(e,u.id,'Approved by MD',comment,'good');}
  }else if(kind==='reject'){e.status='rejected';addTrail(e,u.id,'Rejected',comment,'bad');}
  else if(kind==='return'){e.status='returned';addTrail(e,u.id,'Returned to employee',comment,'info');}
  persist();return '';
}
function postPayment(e,u,amount,method,accId,ref,key){
  if(!canPay(e,u))return 'Only Accounts can pay an approved expense.';
  if(db.pays.some(function(p){return p.key===key;}))return 'dup';
  amount=Math.round(Number(amount)*100)/100;
  if(!(amount>0))return 'Enter a payment amount.';
  if(amount>outstanding(e)+0.001)return 'Amount is more than the outstanding '+inr(outstanding(e))+'.';
  if(method==='cash'&&amount>pettyBalance())return 'Cash drawer has only '+inr(pettyBalance())+'.';
  db.pays.push({id:uid(),exp:e.id,method:method,account:accId,amount:amount,ref:ref||'',key:key,by:u.id,ts:new Date().toISOString(),reconciled:false});
  e.paid=Math.round((e.paid+amount)*100)/100;
  e.pay=e.paid>=e.amount-0.001?'paid':'partial';
  addTrail(e,u.id,'Payment posted: '+inr(amount)+' ('+METHOD[method]+')','', 'good');
  persist();return '';
}

app.addEventListener('submit',function(ev){
  var f=ev.target.getAttribute('data-form');if(!f)return;ev.preventDefault();
  var err=$('#err');
  if(f==='sendotp'){
    var m=$('#mobile').value.replace(/\D/g,'');loginMobile=m;
    if(m.length!==10){err.textContent='Enter a 10-digit mobile number.';return;}
    if(!db.users.some(function(x){return x.mobile===m;})){err.textContent='This number is not registered. Ask the admin to add you.';return;}
    otpTries=0;view={name:'otp'};render();
  }else if(f==='verify'){
    var o=$('#otp').value.trim();
    if(otpTries>=5){err.textContent='Too many attempts. Go back and request a new OTP.';return;}
    if(o!=='123456'){otpTries++;err.textContent='Wrong OTP. '+(5-otpTries)+' tries left.';return;}
    var u=db.users.filter(function(x){return x.mobile===loginMobile;})[0];
    db.session=u.id;persist();stack=[];view={name:'home'};render();
  }
});

      if(DA_LINK){toast('Saving to the sheet starts once the JEM backend link is switched on.');break;}
      ccLoad();if(CC.entry){toast("YOU HAVE ALREADY UPDATED COUNTER CASH FOR "+dmy(ccd)+".");break;}if(CC.blocked){toast('ENTRY BLOCKED.');break;}
      var cop=ccd===today()?CC.opening:(parseFloat($('#cc-open').value)||0),ctn=0;CC_NOTES.forEach(function(k,i){ctn+=cn[i]*k;});
      ccRows().push({date:ccd,opening:cop,n:cn,coins:cco,totalNotes:ctn,total:ctn+cco});persist();toast('COUNTER CASH DATA SAVED SUCCESSFULLY!');ccLoad();render();ccTotals();break;
    case 'verify':VF.date=today();VF.counter=vfCounters()[0]||'';VF.items=null;VF.photo='';go('verify');if(VF.counter)vfLoad();else{VF.err='No counter is assigned to you.';refreshVf();}break;
    case 'prsum':PR.sumOpen=!PR.sumOpen;PR.vd='';refreshPr();break;
    case 'prchart':PR.chartOpen=!PR.chartOpen;refreshPr();break;
    case 'prview':var pvd=$('#pr-vdate');if(!pvd||!pvd.value){toast('PLEASE SELECT A DATE TO VIEW METAL PRICES.');break;}PR.vd=pvd.value;refreshPr();break;
    case 'prunlock':var pw=($('#pr-pw')||{}).value||'';if(!pw.trim()){toast('Please enter a password to unlock the form.');break;}
      if(DA_LINK){toast('Unlocking starts once the JEM backend link is switched on.');break;}
      if(pw!=='admin'){PR.msg={t:'INCORRECT PASSWORD.',k:'bad'};toast('INCORRECT PASSWORD.');refreshPr();break;}
      PR.unlocked=true;PR.pin=pw;PR.msg=null;PR.f.dt=prNowDt();refreshPr();break;
    case 'prsave':
      PR.f.dt=($('#pr-dt')||{}).value||PR.f.dt;
      var pfs=['g','gg','s','sg'],pok=PR.f.dt&&pfs.every(function(k){return String(PR.f[k]).trim()!==''&&!isNaN(parseFloat(PR.f[k]));})&&parseFloat(PR.f.gg)>0&&parseFloat(PR.f.sg)>0;
      if(!pok){toast('PLEASE FILL ALL METAL PRICE FIELDS.');break;}
      var pd=PR.f.dt.slice(0,10),pt=PR.f.dt.slice(11,16)||'00:00';
      if(PR.f.dt>prNowDt()){toast('Date cannot be in the future.');break;}
      if(DA_LINK){toast('Saving to the sheet starts once the JEM backend link is switched on.');break;}
      db.prices=db.prices||demoPrices();
      if(db.prices.filter(function(x){return x.date===pd;}).length>=4){PR.msg={t:'ERROR SAVING METAL PRICES: ENTRY LIMIT REACHED: 4 entries already exist for '+pd+'.',k:'bad'};toast('ENTRY LIMIT REACHED: 4 entries already exist for '+pd+'.');refreshPr();break;}
      var pgg=parseFloat(PR.f.gg),psg=parseFloat(PR.f.sg),rr={'24K Gold Rate 999 GST':pgg,'24K Gold Rate 999 Without GST':parseFloat(PR.f.g),'Silver Rate GST':psg,'Silver Rate Without GST':parseFloat(PR.f.s)},cc=prCalc(pgg,psg);Object.keys(cc).forEach(function(k){rr[k]=cc[k];});
      db.prices.push({date:pd,time:pt,rates:rr});persist();PR.unlocked=false;PR.pin='';PR.msg={t:'METAL PRICES SAVED SUCCESSFULLY!',k:'good'};toast('METAL PRICES SAVED SUCCESSFULLY!');prLoad();break;
    case 'vfclear':var wc=b.getAttribute('data-w'),cvs=$('#vf-sig-'+wc);if(cvs&&cvs.getContext)cvs.getContext('2d').clearRect(0,0,cvs.width,cvs.height);if(wc==='c')VF.sigC='';else VF.sigA='';break;
    case 'vfsubmit':
      if(!VF.items||!VF.items.length){toast('No verification data to submit.');break;}
      if(!VF.overall){toast('PLEASE CHECK THE OVERALL DATA VERIFIED BOX.');break;}
      if(!VF.photo){toast('PLEASE TAKE A PICTURE FOR VERIFICATION.');break;}
      if(VF.needs.cash&&!VF.sigC){toast('Cash signature is required.');break;}
      if(VF.needs.asset&&!VF.sigA){toast('Metal signature is required.');break;}
      if(DA_LINK){toast('Saving the report starts once the JEM backend link is switched on.');break;}
      db.verifyLog=db.verifyLog||[];var vnow=new Date(),vp=function(n){return ('0'+n).slice(-2);};db.verifyLog.unshift({date:VF.date,counter:VF.counter,by:me().name,time:vp(vnow.getDate())+'/'+vp(vnow.getMonth()+1)+'/'+vnow.getFullYear()+', '+vp(vnow.getHours())+':'+vp(vnow.getMinutes()),cash:VF.needs.cash,asset:VF.needs.asset,items:VF.items,photo:VF.photo,sigC:VF.needs.cash?VF.sigC:'',sigA:VF.needs.asset?VF.sigA:''});
      db.verifyLog.forEach(function(r,i){if(i>=5){r.photo='';r.sigC='';r.sigA='';}});persist();
      VF.photo='';VF.photoAt='';VF.sigC='';VF.sigA='';VF.overall=false;VF.date=today();VFR.open=0;toast('Verification report submitted.');render();vfLoad();break;
    case 'vfcam':if(!VF.overall){toast('Please check "Overall Data Verified & Matched" first.');break;}
      VF.camErr='';VF.photo='';VF.photoAt='';vfCamStop();
      (navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'}}}).catch(function(){return navigator.mediaDevices.getUserMedia({video:true});}):Promise.reject(new Error('x'))).then(function(st){vfStream=st;VF.cam=true;refreshVf();vfBtn();}).catch(function(){VF.camErr='UNABLE TO ACCESS CAMERA. PLEASE ENSURE IT IS CONNECTED AND PERMISSIONS ARE GRANTED.';refreshVf();vfBtn();});break;
    case 'vfcamx':vfCamStop();refreshVf();vfBtn();break;
    case 'vfshot':var vv=$('#vf-video');if(!vv||!vfStream||!vv.videoWidth){toast('NO ACTIVE VIDEO FEED. PLEASE ACTIVATE CAMERA FIRST.');break;}
      var cvv=document.createElement('canvas'),rr=Math.min(1,720/Math.max(vv.videoWidth,vv.videoHeight));cvv.width=Math.round(vv.videoWidth*rr);cvv.height=Math.round(vv.videoHeight*rr);cvv.getContext('2d').drawImage(vv,0,0,cvv.width,cvv.height);
      VF.photo=cvv.toDataURL('image/png').split(',')[1];VF.photoAt=new Date().toLocaleString();vfCamStop();refreshVf();vfBtn();break;
    case 'vfrep':VFR.open=+b.getAttribute('data-i');render();vfLoad();break;
    case 'vfrepx':VFR.open=-1;render();vfLoad();break;
    case 'vfprint':window.print();break;
    case 'daday':DAD.date=today();DAD.data=null;go('daday');daLoadDay();break;
    case 'datab':DAB.tab=b.getAttribute('data-t');DAB.from=daysAgo(6);DAB.to=today();DAB.q='';DAB.rows=[];DAB.total=0;DAB.sum=0;go('datab');daLoadTab(true);break;
    case 'damore':daLoadTab(false);break;
    case 'daprev':daShiftDay(-1);break;
    case 'danext':daShiftDay(1);break;
    case 'dasec':var sk='s_'+b.getAttribute('data-s');DAO[sk]=(sk==='s_cash')?(DAO[sk]===false):!DAO[sk];refreshDay();break;
    case 'darow':var rk=b.getAttribute('data-k');DAO[rk]=!DAO[rk];if(view.name==='daday')refreshDay();else refreshTab();break;
    case 'dalink':
      var du=$('#daurl').value.trim(),dt=$('#datok').value.trim();
      if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(du)){toast('Enter the full Bridge web app URL ending in /exec.');break;}
      if(dt.length<8){toast('Enter the Bridge token.');break;}
      DA_LINK={url:du,token:dt};try{localStorage.setItem('jem_da_link',JSON.stringify(DA_LINK));}catch(x){}
      DA_LIVE=null;DA_STATE.err='';daSync();render();break;
    case 'dasync':DA_LIVE=null;DA_STATE.err='';daSync();render();break;
    case 'daunlink':DA_LINK=null;DA_LIVE=null;DA_STATE.err='';try{localStorage.removeItem('jem_da_link');}catch(x){}toast('Disconnected. Showing sample data.');render();break;
    case 'savethr':var v=Number($('#thr').value);if(!(v>=0)){toast('Enter a valid amount.');break;}db.settings.mdThreshold=v;persist();toast('Threshold saved.');break;
    case 'reset':
      modal('<h2>Reset demo data?</h2><div>This clears all expenses you added and restores the sample data.</div><div class="btns"><button class="btn" data-act="mclose">Cancel</button><button class="btn bad" data-act="doreset">Reset</button></div>');break;
    case 'doreset':closeModal();db=seed();persist();draft=null;stack=[];view={name:'login'};toast('Demo data restored.');render();break;
    case 'logout':db.session=null;persist();stack=[];draft=null;view={name:'login'};render();break;
  }
});
app.addEventListener('pointerdown',function(ev){var t=ev.target,w=t.getAttribute&&t.getAttribute('data-sig');if(!w||!t.getContext)return;ev.preventDefault();var g=t.getContext('2d'),p=vfPos(t,ev);g.beginPath();g.moveTo(p.x,p.y);vfDraw={cv:t,w:w};if(t.setPointerCapture)try{t.setPointerCapture(ev.pointerId);}catch(x){}});
app.addEventListener('pointermove',function(ev){if(!vfDraw)return;var p=vfPos(vfDraw.cv,ev),g=vfDraw.cv.getContext('2d');g.lineTo(p.x,p.y);g.stroke();});
function vfEnd(){if(!vfDraw)return;var d=vfDraw;vfDraw=null;var b64=d.cv.toDataURL('image/png').split(',')[1];if(d.w==='fx'){if(FX.ver)FX.ver.sig=b64;}else if(d.w==='c')VF.sigC=b64;else VF.sigA=b64;}
app.addEventListener('pointerup',vfEnd);app.addEventListener('pointercancel',vfEnd);
view=db.session&&me()?{name:'home'}:{name:'login'};
render();
})();
